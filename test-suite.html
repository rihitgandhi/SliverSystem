<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f8fd">
  <title>Accessibility settings test page</title>
  <link rel="stylesheet" href="./styles/accessibility-settings.css?v=3">
  <style>
    body { margin: 0; background: #f5f8fd; color: #1d1d1f; font-family: Arial, sans-serif; }
    main { max-width: 48rem; margin: 0 auto; padding: 3rem 1.5rem; }
    .test-card { padding: 1.5rem; border: 1px solid #cfd6df; border-radius: 1rem; background: #fff; }
    .test-animation { width: 2rem; height: 2rem; background: #075fc9; animation: pulse 2s infinite; }
    @keyframes pulse { 50% { transform: scale(1.25); } }
  </style>
  <script>
    window.motionCalls = [];
    window.Lenis = class {
      start() { window.motionCalls.push('start'); }
      stop() { window.motionCalls.push('stop'); }
      scrollTo() {}
    };
  </script>
</head>
<body>
  <main>
    <article class="test-card">
      <h1>Accessibility settings test page</h1>
      <p id="test-copy">This paragraph verifies text size, spacing, font, and contrast preferences.</p>
      <p><a id="test-link" href="#test-copy">Example text link</a></p>
      <div class="test-animation" aria-label="Animated test element"></div>
    </article>
  </main>
  <script src="./scripts/page-transitions.js?v=3"></script>
  <script src="./scripts/accessibility-settings.js?v=3"></script>
</body>
</html>
