name: Deploy SliverSystem App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sliversystem-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_SUBSCRIPTION_ID: 395e1b4f-f9e3-447c-b4ac-36fe31e2229d
      AZURE_RESOURCE_GROUP: SliverSystem-RG
      AZURE_WEBAPP_NAME: sliversystem-dg395e
      ACR_NAME: sliversystemdg395e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test application
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest test_app_endpoints test_local_checker test_rendered_audit
      # Reuses StockResearch's passwordless production deployment identity.
      # These IDs are public identifiers, not secret credentials.
      - uses: azure/login@v2
        with:
          client-id: 309959b6-4118-49b9-ad74-bbea01f6ced3
          tenant-id: a41dbdf5-254d-4350-970a-4f773b229683
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Verify isolated target
        shell: bash
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$AZURE_SUBSCRIPTION_ID"
          test "$AZURE_RESOURCE_GROUP" = 'SliverSystem-RG'
          test "$AZURE_WEBAPP_NAME" = 'sliversystem-dg395e'
          test "$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query serverFarmId -o tsv | tr '[:upper:]' '[:lower:]')" = "/subscriptions/$AZURE_SUBSCRIPTION_ID/resourcegroups/sliversystem-rg/providers/microsoft.web/serverfarms/sliversystem-plan"
      - name: Build immutable release image
        shell: bash
        run: |
          set -euo pipefail
          az acr build --registry "$ACR_NAME" --image "sliversystem:$GITHUB_SHA" --build-arg "APP_REVISION=$GITHUB_SHA" .
          DIGEST=$(az acr repository show -n "$ACR_NAME" --image "sliversystem:$GITHUB_SHA" --query digest -o tsv)
          test -n "$DIGEST"
          echo "RELEASE_IMAGE=$ACR_NAME.azurecr.io/sliversystem@$DIGEST" >> "$GITHUB_ENV"
      - name: Deploy release
        shell: bash
        run: |
          set -euo pipefail
          az webapp config container set -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --container-image-name "$RELEASE_IMAGE" --container-registry-url "https://$ACR_NAME.azurecr.io" --output none
          az webapp restart -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --output none
          HOST=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEBAPP_NAME" --query defaultHostName -o tsv)
          echo "APP_URL=https://$HOST" >> "$GITHUB_ENV"
      - name: Verify deployed revision, homepage and Azure OpenAI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl --fail --silent --max-time 20 "$APP_URL/api/health" -o "$RUNNER_TEMP/health.json" && python -c 'import json,os; h=json.load(open(os.environ["RUNNER_TEMP"]+"/health.json")); assert h["status"]=="healthy"; assert h["api_key"]=="configured"; assert h["revision"]==os.environ["GITHUB_SHA"]' && curl --fail --silent --max-time 20 "$APP_URL/" -o /dev/null; then
              break
            fi
            [[ "$attempt" == '40' ]] && { echo '::error::The deployed revision did not become healthy.'; exit 1; }
            sleep 15
          done
          python - <<'PY'
          import json, os
          request = {
              'content': ('Individuals are requested to ascertain whether implementation of these procedures '
                          'requires authorization before operational activities begin. All participants must '
                          'submit documentation by Friday to facilitate timely processing.'),
              'reading_level': 'elementary',
          }
          with open(os.environ['RUNNER_TEMP'] + '/ai-request.json', 'w', encoding='utf-8') as stream:
              json.dump(request, stream)
          PY
          curl --fail --silent --show-error --max-time 180 \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/ai-request.json" \
            "$APP_URL/api/simplify-content" -o "$RUNNER_TEMP/ai-result.json"
          python - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/ai-result.json', encoding='utf-8') as stream:
              result = json.load(stream)
          assert 'error' not in result, result.get('error')
          assert '_fallback_reason' not in result, 'Application used its non-AI fallback'
          assert result.get('simplified_content'), 'Azure OpenAI returned no simplified content'
          assert not any('fallback' in str(item).lower() for item in result.get('improvements', []))
          PY
          {
            echo "Deployed $GITHUB_SHA to $APP_URL"
            echo 'Azure OpenAI live request succeeded without fallback.'
          } >> "$GITHUB_STEP_SUMMARY"
