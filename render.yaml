services:
  - type: web
    name: sliversystem-backend
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://rihitgandhi.github.io
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
      - key: WEB_CONCURRENCY
        value: 1
    healthCheckPath: /api/health
    autoDeploy: true
