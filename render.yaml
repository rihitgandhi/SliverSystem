services:
  - type: web
    name: sliversystem-backend
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://rihitgandhi.github.io
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
      - key: AZURE_OPENAI_ENDPOINT
        value: https://dhiraj-gandhi-6076-resource.cognitiveservices.azure.com/
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-5.3-chat
      - key: AZURE_OPENAI_API_VERSION
        value: 2024-12-01-preview
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
    healthCheckPath: /api/health
    autoDeploy: true
